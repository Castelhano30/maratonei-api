name: Backup semanal

on:
  schedule:
    - cron: '17 5 * * 0' # domingo, 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    name: pg_dump
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # O runner traz o cliente 16; o servidor é 17 e o pg_dump precisa ser da mesma versão ou maior.
      - name: Instalar cliente PostgreSQL 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17

      - name: Gerar dump
        env:
          BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          test -n "$BACKUP_DATABASE_URL" || { echo "Secret BACKUP_DATABASE_URL não configurado"; exit 1; }
          bash scripts/backup.sh "maratonei-$(date -u +%Y%m%d).dump"

      - uses: actions/upload-artifact@v4
        with:
          name: maratonei-dump
          path: maratonei-*.dump
          retention-days: 30
          if-no-files-found: error
